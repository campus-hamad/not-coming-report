<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>הודעת נעדרים — קמפוס חמ"ד</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--navy:#005bb6;--navy2:#00488f;--navy-soft:#eaf2fb;--gold:#f98d0e;--gold-soft:#fdf0de;--bg:#f3f5fa;--card:#fff;--border:#e3e7f0;--text:#1b2036;--muted:#707691;--ok:#1f8a5f;}*{box-sizing:border-box;}body{font-family:"Rubik","Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#eef3fb 0%,var(--bg) 320px);color:var(--text);margin:0;padding:28px 16px 60px;-webkit-font-smoothing:antialiased;}.wrap{max-width:560px;margin:0 auto;}.eyebrow{color:var(--gold);font-weight:700;font-size:12.5px;letter-spacing:.04em;margin:0 0 6px;}h1{font-size:21px;margin:0 0 4px;color:var(--navy);font-weight:700;}.sub{color:var(--muted);font-size:13.5px;margin:0 0 22px;}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 10px 30px -14px rgba(0,60,120,.18);}label{display:block;font-size:14px;font-weight:600;margin:0 0 7px;color:var(--text);}.field{margin-bottom:18px;}select,input[type=date],textarea{width:100%;font-size:15px;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-family:inherit;transition:border-color .15s,box-shadow .15s;}select:focus,input[type=date]:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft);}textarea{resize:vertical;min-height:70px;}.pills{display:flex;flex-wrap:wrap;gap:9px;}.pill{flex:1 1 auto;text-align:center;padding:12px 14px;border:1.5px solid var(--border);border-radius:999px;cursor:pointer;font-size:14.5px;font-weight:500;user-select:none;background:#fff;color:var(--text);transition:background .15s,border-color .15s,color .15s,box-shadow .15s;}.pill:hover{border-color:var(--navy);}.pill.active{background:linear-gradient(180deg,var(--navy),var(--navy2));border-color:var(--navy);color:#fff;box-shadow:0 6px 16px -8px rgba(0,91,182,.55);}.checklist{display:flex;flex-direction:column;gap:8px;}.checkrow{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:14.5px;user-select:none;transition:border-color .15s,background .15s;}.checkrow:hover{border-color:var(--navy);}.checkrow input{width:17px;height:17px;accent-color:var(--navy);cursor:pointer;flex-shrink:0;}.hint{color:var(--muted);font-size:12.5px;margin:7px 2px 0;transition:opacity .6s ease,color .3s ease;}.hint.corrected{color:var(--gold);font-weight:500;}.hint.fade{opacity:0;}.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;}.collapse.open{grid-template-rows:1fr;}.collapse>div{overflow:hidden;}.collapse-inner-pad{padding-top:4px;}button.submit{width:100%;padding:14px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(180deg,var(--navy),var(--navy2));box-shadow:0 10px 20px -10px rgba(0,91,182,.6);border:none;border-radius:12px;cursor:pointer;margin-top:6px;transition:opacity .15s,box-shadow .15s,transform .1s;}button.submit:active{transform:translateY(1px);}button.submit:disabled{opacity:.6;cursor:default;box-shadow:none;}.msg{font-size:13px;margin-top:10px;min-height:16px;}.msg.error{color:#c0392b;font-weight:500;}.doneWrap{display:flex;align-items:center;justify-content:center;min-height:220px;opacity:0;transition:opacity .35s ease;text-align:center;}.doneWrap.show{opacity:1;}.doneWrap .check{width:54px;height:54px;border-radius:50%;background:var(--navy-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px;}.doneWrap h2{font-size:19px;margin:0 0 6px;color:var(--navy);}.doneWrap p{color:var(--muted);font-size:14px;margin:0;}.formWrap{transition:opacity .25s ease;}.formWrap.hiding{opacity:0;}</style></head><body><div id="loadingMsg" style="font-family:Rubik,Arial,sans-serif;text-align:center;padding:60px 16px;color:#707691;">טוען את הטופס…</div><div class="wrap" style="visibility:hidden"><p class="eyebrow">קמפוס חמ"ד</p><h1>הודעת נעדרים</h1><p class="sub">הדיווח מתעדכן מיידית — בלי לדפדף בין עמודים.</p><div class="card"><div class="formWrap" id="formWrap"><div class="field"><label>איזה סוג דיווח?</label><div class="pills" id="roleSelect"><div class="pill" data-val="teacher">מורה</div><div class="pill" data-val="school">מוביל/ת בית ספר</div></div></div><div class="collapse" id="sec_school"><div><div class="collapse-inner-pad"><div class="field"><label>בית ספר</label><select id="f_school"><option value="">בחר/י…</option></select></div><div class="collapse" id="sec_date_school"><div><div class="collapse-inner-pad"><div class="field"><label>תאריך השיעור</label><input type="date" id="f_date_school" required><div class="hint" id="dateHint_school"></div></div></div></div></div><div class="collapse" id="sec_scope"><div><div class="collapse-inner-pad"><div class="field"><label>היקף הדיווח</label><div class="pills" id="scopeSelect"></div></div><div class="collapse" id="sec_course"><div><div class="collapse-inner-pad"><div class="field"><label>קורס</label><select id="f_course"><option value="">בחר/י…</option></select></div><div class="field"><label>רצועה</label><select id="f_courseSlot"><option value="">בחר/י…</option></select></div></div></div></div><div class="collapse" id="sec_slotOnly"><div><div class="collapse-inner-pad"><div class="field"><label>רצועה</label><select id="f_slotOnly"><option value="">בחר/י…</option></select></div></div></div></div><div class="collapse" id="sec_gradeOnly"><div><div class="collapse-inner-pad"><div class="field"><label>כיתה (אפשר לסמן יותר מאחת)</label><div class="checklist" id="f_gradeOnly"></div></div></div></div></div></div></div></div></div></div></div><div class="collapse" id="sec_teacher"><div><div class="collapse-inner-pad"><div class="field"><label>שם המורה</label><select id="f_teacher"><option value="">בחר/י…</option></select></div><div class="collapse" id="sec_date_teacher"><div><div class="collapse-inner-pad"><div class="field"><label>תאריך השיעור</label><input type="date" id="f_date_teacher" required><div class="hint" id="dateHint_teacher"></div></div></div></div></div><div class="collapse" id="sec_teacherItems"><div><div class="collapse-inner-pad"><div class="field"><label>קורס ורצועה (אפשר לבחור יותר מאחת)</label><div class="checklist" id="f_teacherItems"></div></div></div></div></div></div></div></div><div class="collapse" id="sec_finish"><div><div class="collapse-inner-pad"><div class="field"><label>סיבת ההיעדרות</label><textarea id="f_reason" placeholder="טקסט חופשי…"></textarea></div><div class="field"><label>פירוט נוסף / הערה (אופציונלי)</label><textarea id="f_note"></textarea></div><button class="submit" id="submitBtn">שליחת הדיווח</button><div class="msg" id="msg"></div></div></div></div></div><div class="doneWrap" id="doneWrap"><div><div class="check">✓</div><h2>הדיווח נשלח</h2><p>תודה — הדיווח התקבל ועודכן במערכת.</p></div></div></div></div><script>
var API_URL = 'https://script.google.com/macros/s/AKfycbzcrIPSOSQnXEAkCktuHgi0jBz1SaKt3VPFfGOce7PWLIlZSzfe62pkB_YQSnd2XHKO/exec';
// מחליף את google.script.run של Apps Script בשליחה רגילה לשרת
window.google = { script: { run: (function () {
  var ok = function(){}, fail = function(){};
  var r = {
    withSuccessHandler: function (f) { ok = f; return r; },
    withFailureHandler: function (f) { fail = f; return r; },
    atSubmitExceptionReportWeb: function (payload) {
      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
        .then(function (res) { return res.json(); })
        .then(function (j) { if (j && j.ok) ok(j); else fail(new Error((j && j.error) || 'השליחה נכשלה')); })
        .catch(function () { fail(new Error('אין חיבור לשרת. בדקו את החיבור לאינטרנט ונסו שוב.')); });
    }
  };
  return r;
})() } };
fetch(API_URL + '?api=formData')
  .then(function (res) { return res.json(); })
  .then(function (DATA) {
    document.getElementById('loadingMsg') && document.getElementById('loadingMsg').remove();
    document.querySelector('.wrap').style.visibility = 'visible';
var state = { role: null, school: null, scope: null };function fillSelect(sel, values, placeholder) {  sel.innerHTML = "<option value=\"\">" + placeholder + "</option>" +    values.map(function (v) { return "<option value=\"" + v.value + "\">" + v.label + "</option>"; }).join("");}function openCollapse(id, open) {  var el = document.getElementById(id);  if (open) el.classList.add("open"); else el.classList.remove("open");}function slotOptions(slotKeys) {  return slotKeys.map(function (s) { return { value: s, label: s + (DATA.slotLabels[s] ? (" — " + DATA.slotLabels[s]) : "") }; });}var DOW_NAMES_ = {0:"ראשון",1:"שני",2:"שלישי",3:"רביעי",4:"חמישי",5:"שישי",6:"שבת"};function pad2_(n) { return (n < 10 ? "0" : "") + n; }function dateToValue_(d) { return d.getFullYear() + "-" + pad2_(d.getMonth() + 1) + "-" + pad2_(d.getDate()); }function setDateHint_(hintId, dow) {  document.getElementById(hintId).textContent = "השיעורים מתקיימים בימי " + DOW_NAMES_[dow] + ".";}function snapDateToWeekday_(input, dow, hintId) {  if (!input.value) return;  var d = new Date(input.value + "T00:00:00");  if (isNaN(d.getTime()) || d.getDay() === dow) return;  var fwd = (dow - d.getDay() + 7) % 7;  var back = fwd - 7;  d.setDate(d.getDate() + (Math.abs(back) < fwd ? back : fwd));  input.value = dateToValue_(d);  var hint = document.getElementById(hintId);  var original = hint.textContent;  var disp = input.value.split("-").reverse().join("/");  hint.textContent = "התאריך הותאם ליום " + DOW_NAMES_[dow] + " הקרוב — " + disp + ".";  hint.classList.add("corrected");  hint.classList.remove("fade");  clearTimeout(hint._fadeTimer);  hint._fadeTimer = setTimeout(function () {    hint.classList.add("fade");    setTimeout(function () { hint.textContent = original; hint.classList.remove("fade", "corrected"); }, 650);  }, 2600);}document.getElementById("f_date_school").addEventListener("change", function () {  snapDateToWeekday_(this, Number(this.dataset.weekday || 2), "dateHint_school");});document.getElementById("f_date_teacher").addEventListener("change", function () {  snapDateToWeekday_(this, Number(this.dataset.weekday || 2), "dateHint_teacher");});document.getElementById("roleSelect").addEventListener("click", function (e) {  var pill = e.target.closest(".pill"); if (!pill) return;  state.role = pill.getAttribute("data-val");  Array.prototype.forEach.call(document.getElementById("roleSelect").children, function (p) {    p.classList.toggle("active", p === pill);  });  openCollapse("sec_school", state.role === "school");  openCollapse("sec_teacher", state.role === "teacher");  openCollapse("sec_finish", true);});var schoolSel = document.getElementById("f_school");fillSelect(schoolSel, DATA.schools.map(function (s) { return { value: s, label: s }; }), "בחר/י…");schoolSel.addEventListener("change", function () {  state.school = schoolSel.value;  openCollapse("sec_date_school", !!state.school);  openCollapse("sec_scope", !!state.school);  openCollapse("sec_course", false); openCollapse("sec_slotOnly", false); openCollapse("sec_gradeOnly", false);  if (!state.school) return;  var schoolDow = DATA.schoolWeekday[state.school] || 2;  var schoolDateInput = document.getElementById("f_date_school");  schoolDateInput.dataset.weekday = schoolDow;  setDateHint_("dateHint_school", schoolDow);  snapDateToWeekday_(schoolDateInput, schoolDow, "dateHint_school");  var scopeWrap = document.getElementById("scopeSelect");  var choices = [    { val: "whole", label: DATA.scopeLabels.whole },    { val: "course", label: DATA.scopeLabels.course }  ];  var slots = DATA.schoolSlotMap[state.school] || [];  var grades = DATA.schoolGradeMap[state.school] || [];  if (slots.length > 1) choices.push({ val: "slot", label: DATA.scopeLabels.slot });  if (grades.length > 1) choices.push({ val: "grade", label: DATA.scopeLabels.grade });  scopeWrap.innerHTML = choices.map(function (c) {    return "<div class=\"pill\" data-val=\"" + c.val + "\">" + c.label + "</div>";  }).join("");  state.scope = null;  var courseSel = document.getElementById("f_course");  fillSelect(courseSel, (DATA.schoolCourseMap[state.school] || []).map(function (c) { return { value: c, label: c }; }), "בחר/י…");  fillSelect(document.getElementById("f_slotOnly"), slotOptions(slots), "בחר/י…");  document.getElementById("f_gradeOnly").innerHTML = grades.map(function (g) {    return "<label class=\"checkrow\"><input type=\"checkbox\" class=\"gradeChk\" value=\"" + g + "\"> " + g + "</label>";  }).join("");});document.getElementById("scopeSelect").addEventListener("click", function (e) {  var pill = e.target.closest(".pill"); if (!pill) return;  state.scope = pill.getAttribute("data-val");  Array.prototype.forEach.call(document.getElementById("scopeSelect").children, function (p) {    p.classList.toggle("active", p === pill);  });  openCollapse("sec_course", state.scope === "course");  openCollapse("sec_slotOnly", state.scope === "slot");  openCollapse("sec_gradeOnly", state.scope === "grade");});document.getElementById("f_course").addEventListener("change", function () {  var course = this.value;  fillSelect(document.getElementById("f_courseSlot"), slotOptions(DATA.courseSlotMap[course] || []), "בחר/י…");});var teacherSel = document.getElementById("f_teacher");var currentTeacherItems_ = [];function checkedTeacherItems_() {  return Array.prototype.filter.call(document.querySelectorAll(".teacherItemChk"), function (c) { return c.checked; })    .map(function (c) { return currentTeacherItems_[Number(c.value)]; });}function updateTeacherDateWeekday_() {  var checked = checkedTeacherItems_();  var dow = checked.length ? (/רביעי/.test(DATA.slotLabels[checked[0].slot] || "") ? 3 : 2) : 2;  var dateInput = document.getElementById("f_date_teacher");  dateInput.dataset.weekday = dow;  setDateHint_("dateHint_teacher", dow);  snapDateToWeekday_(dateInput, dow, "dateHint_teacher");}fillSelect(teacherSel, DATA.teachers.map(function (t) { return { value: t.name, label: t.name }; }), "בחר/י…");teacherSel.addEventListener("change", function () {  var t = DATA.teachers.find(function (x) { return x.name === teacherSel.value; });  currentTeacherItems_ = t ? t.items : [];  document.getElementById("f_teacherItems").innerHTML = currentTeacherItems_.map(function (it, i) {    return "<label class=\"checkrow\"><input type=\"checkbox\" class=\"teacherItemChk\" value=\"" + i + "\"> " + it.label + "</label>";  }).join("");  document.getElementById("f_date_teacher").value = "";  setDateHint_("dateHint_teacher", 2);  openCollapse("sec_date_teacher", !!t);  openCollapse("sec_teacherItems", false);});document.getElementById("f_date_teacher").addEventListener("change", function () {  updateTeacherDateWeekday_();  openCollapse("sec_teacherItems", true);});document.getElementById("f_teacherItems").addEventListener("change", function (e) {  if (!e.target.classList.contains("teacherItemChk")) return;  updateTeacherDateWeekday_();});function scopeKeyToLabel(key) {  if (key === "whole") return DATA.scopeLabels.whole;  if (key === "course") return DATA.scopeLabels.course;  if (key === "slot") return DATA.scopeLabels.slot;  if (key === "grade") return DATA.scopeLabels.grade;  return "";}document.getElementById("submitBtn").addEventListener("click", function () {  var msg = document.getElementById("msg"); msg.textContent = ""; msg.className = "msg";  var reason = document.getElementById("f_reason").value.trim();  if (!state.role) { msg.textContent = "נא לבחור סוג דיווח."; msg.className = "msg error"; return; }  var date = state.role === "teacher"    ? document.getElementById("f_date_teacher").value    : document.getElementById("f_date_school").value;  if (!date) { msg.textContent = "נא לבחור תאריך."; msg.className = "msg error"; return; }  if (!reason) { msg.textContent = "נא למלא סיבה."; msg.className = "msg error"; return; }  var payload = { date: date, reason: reason, note: document.getElementById("f_note").value.trim(), role: state.role };  if (state.role === "teacher") {    if (!teacherSel.value) { msg.textContent = "נא לבחור מורה."; msg.className = "msg error"; return; }    var checkedItems = checkedTeacherItems_();    if (!checkedItems.length) { msg.textContent = "נא לבחור לפחות קורס ורצועה אחת."; msg.className = "msg error"; return; }    payload.teacherName = teacherSel.value;    payload.teacherLabels = checkedItems.map(function (it) { return it.label; });  } else {    if (!state.school) { msg.textContent = "נא לבחור בית ספר."; msg.className = "msg error"; return; }    if (!state.scope) { msg.textContent = "נא לבחור היקף דיווח."; msg.className = "msg error"; return; }    payload.school = state.school; payload.scope = scopeKeyToLabel(state.scope);    if (state.scope === "course") {      var course = document.getElementById("f_course").value, slot = document.getElementById("f_courseSlot").value;      if (!course || !slot) { msg.textContent = "נא לבחור קורס ורצועה."; msg.className = "msg error"; return; }      payload.course = course; payload.slot = slot;    } else if (state.scope === "slot") {      var slotOnly = document.getElementById("f_slotOnly").value;      if (!slotOnly) { msg.textContent = "נא לבחור רצועה."; msg.className = "msg error"; return; }      payload.slot = slotOnly;    } else if (state.scope === "grade") {      var grades = Array.prototype.map.call(document.querySelectorAll(".gradeChk:checked"), function (c) { return c.value; });      if (!grades.length) { msg.textContent = "נא לסמן לפחות כיתה אחת."; msg.className = "msg error"; return; }      payload.grades = grades;      payload.grade = grades[0];    }  }  var btn = document.getElementById("submitBtn"); btn.disabled = true; btn.textContent = "שולח…";  google.script.run    .withSuccessHandler(function () {      var fw = document.getElementById("formWrap"), dw = document.getElementById("doneWrap");      fw.classList.add("hiding");      setTimeout(function () { fw.style.display = "none"; dw.classList.add("show"); }, 250);    })    .withFailureHandler(function (err) {      btn.disabled = false; btn.textContent = "שליחת הדיווח";      msg.textContent = "שגיאה: " + (err && err.message ? err.message : err);      msg.className = "msg error";    })    .atSubmitExceptionReportWeb(payload);});
  })
  .catch(function () {
    var l = document.getElementById('loadingMsg');
    if (l) l.textContent = 'לא הצלחנו לטעון את הטופס. נסו לרענן את הדף בעוד רגע.';
  });
</script></body></html>
